steps:
  # Step 1: Load secret from Secret Manager and check values
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "verify-secret"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "$_ENV_FILE" | grep "="

    secretEnv:
      - "_ENV_FILE"

  # Step 2: Build Docker Image and pass env from secret
  - name: "gcr.io/cloud-builders/docker"
    id: "build-docker-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "$_ENV_FILE" > .env
        export $(cat .env | xargs)

        docker build \
          -t us-central1-docker.pkg.dev/test-ecommerce-462704/ecommerce-api/ecommerce-api:$SHORT_SHA \
          --build-arg DB_HOST=$DB_HOST \
          --build-arg DB_PORT=$DB_PORT \
          --build-arg DB_USER=$DB_USER \
          --build-arg DB_PASSWORD=$DB_PASSWORD \
          --build-arg DB_NAME=$DB_NAME \
          --build-arg SSL_MODE=$SSL_MODE \
          --build-arg USER_SECRET=$USER_SECRET \
          --build-arg SHOP_SECRET=$SHOP_SECRET \
          --progress=plain .

    secretEnv:
      - "_ENV_FILE"

  # Step 3: Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/test-ecommerce-462704/ecommerce-api/ecommerce-api:$SHORT_SHA"
      ]

  # Step 4: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-cloudrun"
    entrypoint: "gcloud"
    args:
      [
        "run",
        "deploy",
        "$SERVICE_NAME",
        "--image",
        "us-central1-docker.pkg.dev/test-ecommerce-462704/ecommerce-api/ecommerce-api:$SHORT_SHA",
        "--region",
        "$REGION",
        "--platform",
        "managed",
        "--allow-unauthenticated"
      ]

images:
  - "us-central1-docker.pkg.dev/test-ecommerce-462704/ecommerce-api/ecommerce-api:$SHORT_SHA"

availableSecrets:
  secretManager:
    - versionName: projects/783881626577/secrets/env-secret/versions/1
      env: "_ENV_FILE"
