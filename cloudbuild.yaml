# cloudbuild.yaml
steps:
  # 1. Build the Docker image
  # ไม่มี secretEnv ที่นี่ เพราะเราไม่ได้ส่ง secrets เป็น build-args
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/test-ecommerce-462704/ecommerce-api/ecommerce-api:$SHORT_SHA'
      - '.' # Build context is the current directory

  # 2. Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/test-ecommerce-462704/ecommerce-api/ecommerce-api:$SHORT_SHA']

  # 3. Deploy to Cloud Run
  # ไม่มี secretEnv ที่นี่ เพราะเราใช้ --set-secrets ซึ่ง gcloud CLI จัดการเอง
  # ไม่มี entrypoint: 'bash' หรือ args: ['-c', '|'] ด้วย เพราะไม่จำเป็น
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'run'
      - 'deploy'
      - 'ecommerce-api' # ชื่อ Cloud Run Service ของคุณ
      - '--image'
      - 'us-central1-docker.pkg.dev/test-ecommerce-462704/ecommerce-api/ecommerce-api:$SHORT_SHA'
      - '--region'
      - 'us-central1' # เลือก Region ของ Cloud Run ให้ตรงกับ Artifact Registry
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated' # หรือ '--no-allow-unauthenticated'
      - '--set-secrets' # นี่คือจุดที่ถูกต้องและปลอดภัยที่สุด!
      - 'DB_HOST=projects/783881626577/secrets/DB_HOST:latest'
      - 'DB_PORT=projects/783881626577/secrets/DB_PORT:latest'
      - 'DB_USER=projects/783881626577/secrets/DB_USER:latest'
      - 'DB_PASSWORD=projects/783881626577/secrets/DB_PASSWORD:latest'
      - 'DB_NAME=projects/783881626577/secrets/DB_NAME:latest'
      - 'SSL_MODE=projects/783881626577/secrets/SSL_MODE:latest'
      - 'USER_SECRET=projects/783881626577/secrets/USER_SECRET:latest'
      - 'SHOP_SECRET=projects/783881626577/secrets/SHOP_SECRET:latest'

# availableSecrets:
# ส่วนนี้ต้องยังคงมีอยู่เสมอ เพื่อให้ Cloud Build รู้ว่าต้องเตรียมการเข้าถึง Secrets เหล่านี้จาก Secret Manager
# และเพื่อให้ Cloud Build Service Account มีสิทธิ์ในการอ่าน Secrets เหล่านี้
availableSecrets:
  secretManager:
    - versionName: projects/783881626577/secrets/DB_HOST/versions/1
      env: DB_HOST
    - versionName: projects/783881626577/secrets/DB_PORT/versions/1
      env: DB_PORT
    - versionName: projects/783881626577/secrets/DB_USER/versions/1
      env: DB_USER
    - versionName: projects/783881626577/secrets/DB_PASSWORD/versions/1
      env: DB_PASSWORD
    - versionName: projects/783881626577/secrets/DB_NAME/versions/1
      env: DB_NAME
    - versionName: projects/783881626577/secrets/SSL_MODE/versions/1
      env: SSL_MODE
    - versionName: projects/783881626577/secrets/USER_SECRET/versions/1
      env: USER_SECRET
    - versionName: projects/783881626577/secrets/SHOP_SECRET/versions/1
      env: SHOP_SECRET

images:
  - us-central1-docker.pkg.dev/test-ecommerce-462704/ecommerce-api/ecommerce-api:$SHORT_SHA

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY