availableSecrets:
  secretManager:
    - versionName: projects/783881626577/secrets/env-secret/versions/1
      env: "_ENV_FILE"

steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "$_ENV_FILE" > .env
        export $(grep ^[A-Z_] .env | xargs)

        docker build \
          -t gcr.io/$PROJECT_ID/ecommerce-api:$SHORT_SHA \
          --build-arg DB_HOST=$DB_HOST \
          --build-arg DB_PORT=$DB_PORT \
          --build-arg DB_USER=$DB_USER \
          --build-arg DB_PASSWORD=$DB_PASSWORD \
          --build-arg DB_NAME=$DB_NAME \
          --build-arg SSL_MODE=$SSL_MODE \
          --build-arg USER_SECRET=$USER_SECRET \
          --build-arg SHOP_SECRET=$SHOP_SECRET \
          --progress=plain .

    secretEnv:
      - "_ENV_FILE"

images:
  - gcr.io/$PROJECT_ID/ecommerce-api:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY  # หรือเปลี่ยนเป็นแบบอื่นตามที่เลือก